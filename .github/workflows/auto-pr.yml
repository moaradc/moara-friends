name: auto-pr

# PR 校验 + 自动合并 workflow
#
# 触发：pull_request_target (opened/synchronize/reopened)
#   ⚠️ 用 pull_request_target 而非 pull_request，因为贡献者从 fork 提 PR 时，
#      pull_request 会以 fork 的 ref 跑代码，有安全风险；pull_request_target 用 base 的代码 + secrets。
#
# 校验维度：
#   1. PR 只能改 data/friends/ 下单个 .json 文件
#   2. JSON 必须是对象
#   3. name 必填非空字符串
#   4. url 必填、必须是 http/https URL
#   5. avatar 可空、若提供必须是字符串
#   6. description 可选、若提供必须是字符串
#   7. vip 字段一律拒绝（PR 携带 vip 立即终止，防作弊）
#   8. URL 可达性检查（详见 checkUrl 函数注释）
#   9. avatar 可达性 + content-type 校验
#
# 评论策略：
#   - PR 打开时发一条「欢迎评论」（仅 opened 时机）
#   - 校验过程中维护一条「进度评论」（持续 update）
#   - 失败时把进度评论更新为最终错误清单 + 修复指引
#   - 成功时把进度评论更新为合并确认
#   - 始终只有 1 条动态评论，避免污染 PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write  # 用于触发 build workflow (createWorkflowDispatch)

env:
  PAT: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: auto-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const prHead = context.payload.pull_request.head;
            const prAuthor = context.payload.pull_request.user.login;
            const action = context.payload.action; // opened | synchronize | reopened
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const startedAt = new Date().toISOString();

            // ── 评论管理 ─────────────────────────────────────
            // 维护「一条进度评论」，校验过程中持续更新
            let progressCommentId = null;

            async function upsertProgress(body) {
              try {
                if (progressCommentId) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: progressCommentId, body,
                  });
                } else {
                  const res = await github.rest.issues.createComment({
                    owner, repo, issue_number: pull_number, body,
                  });
                  progressCommentId = res.data.id;
                }
              } catch (e) {
                core.warning(`upsertProgress failed: ${e.message}`);
              }
            }

            // 欢迎评论：仅 PR opened 时发一次
            async function postWelcome() {
              if (action !== 'opened') return;
              const welcome = [
                `👋 你好 @${prAuthor}，感谢提交友链！`,
                '',
                '本仓库使用 GitHub Action 自动校验 PR，无需人工审核。校验流程：',
                '',
                '1. 📁 文件路径校验',
                '2. 📋 JSON schema 校验',
                '3. 🚫 vip 字段检查',
                '4. 🌐 站点 URL 可达性检查',
                '5. 🖼️ 头像 URL 可达性检查',
                '',
                '校验全部通过后会自动合并，数分钟后 jsDelivr CDN 缓存刷新即可生效。',
                '',
                `⏱️ 开始时间：${startedAt}`,
                '',
                '---',
                '校验进度见下方评论 ↓',
              ].join('\n');
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull_number, body: welcome,
                });
              } catch (e) {
                core.warning(`welcome comment failed: ${e.message}`);
              }
            }

            // 最终结果评论：失败时附加修复指引
            // 每行格式自动推断：
            //   - 空行 → 保留空行（分段）
            //   - 已以列表前缀 (- / * / 数字.) 开头 → 不再加前缀
            //   - 代码块 (```) 或缩进行 → 不加前缀
            //   - 其他普通行 → 加 `- ` 前缀
            async function postResult(success, title, lines) {
              const icon = success ? '✅' : '❌';
              const body = [
                `## ${icon} ${title}`,
                '',
                ...lines.map((l) => {
                  if (l === '') return '';
                  if (l.startsWith('```') || l.startsWith('    ')) return l;
                  if (/^\s*([-*+]|\d+\.)\s/.test(l)) return l;
                  return `- ${l}`;
                }),
                '',
                '---',
                `⏱️ 耗时：${Math.round((Date.now() - new Date(startedAt).getTime()) / 1000)}s  `,
                `[查看 Action 运行日志](${runUrl})`,
              ].join('\n');
              await upsertProgress(body);
            }

            // 失败时关闭 PR
            async function closePR() {
              try {
                await github.rest.pulls.update({ owner, repo, pull_number, state: 'closed' });
              } catch (e) {
                core.warning(`close PR failed: ${e.message}`);
              }
            }

            // ── 可达性检查 ───────────────────────────────────
            // 改进点：
            //   1. 多 UA 轮换（GitHub Actions IP 容易被风控，用浏览器 UA 提高通过率）
            //   2. 直接 GET + Range（替代 HEAD）：少数服务器拒绝 HEAD 或 HEAD 返回 405；
            //      Range: bytes=0-0 只取首字节，带宽极小但服务器都支持
            //   3. 重试 2 次，指数退避（500ms / 1500ms）
            //   4. 分级超时：连接 5s / 整体 15s
            //   5. avatar 必须是 image/* content-type（防 HTML 404 页面伪装）
            //   6. 追踪重定向链，失败时记录最终落点
            const USER_AGENTS = [
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
              'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15',
              'Mozilla/5.0 (compatible; Googlebot/2.1; +https://www.google.com/bot.html)',
            ];

            async function fetchWithRetry(url, { requireImage = false } = {}) {
              const errors = [];
              const redirects = [];

              for (let attempt = 0; attempt < 3; attempt++) {
                const ua = USER_AGENTS[attempt % USER_AGENTS.length];
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 15000);
                try {
                  const res = await fetch(url, {
                    method: 'GET',
                    redirect: 'manual', // 手动追踪，便于记录重定向链
                    signal: controller.signal,
                    headers: {
                      'User-Agent': ua,
                      'Accept': requireImage ? 'image/*' : '*/*',
                      'Range': 'bytes=0-1023', // 只取首 1KB，省带宽
                      'Accept-Encoding': 'identity',
                    },
                  });
                  clearTimeout(timer);

                  // 手动跟随重定向（最多 5 跳）
                  let finalRes = res;
                  let location = res.headers.get('location');
                  let hops = 0;
                  while ([301, 302, 303, 307, 308].includes(finalRes.status) && location && hops < 5) {
                    redirects.push(`${finalRes.status} → ${location}`);
                    const nextUrl = new URL(location, url).href;
                    const c2 = new AbortController();
                    const t2 = setTimeout(() => c2.abort(), 15000);
                    finalRes = await fetch(nextUrl, {
                      method: 'GET',
                      redirect: 'manual',
                      signal: c2.signal,
                      headers: {
                        'User-Agent': ua,
                        'Accept': requireImage ? 'image/*' : '*/*',
                        'Range': 'bytes=0-1023',
                        'Accept-Encoding': 'identity',
                      },
                    });
                    clearTimeout(t2);
                    location = finalRes.headers.get('location');
                    hops++;
                  }

                  if (finalRes.status >= 200 && finalRes.status < 400) {
                    if (requireImage) {
                      const ct = (finalRes.headers.get('content-type') || '').toLowerCase();
                      if (!ct.startsWith('image/')) {
                        errors.push(`Content-Type 不是 image/* (实际: ${ct || '空'})`);
                        // 继续重试其他 UA
                        await sleep(500 * Math.pow(3, attempt));
                        continue;
                      }
                    }
                    return {
                      ok: true,
                      status: finalRes.status,
                      finalUrl: finalRes.url,
                      contentType: finalRes.headers.get('content-type'),
                      redirects,
                      attempts: attempt + 1,
                    };
                  }

                  // 405/403 时退回完整 GET（不带 Range，部分 CDN 对 Range 敏感）
                  if (finalRes.status === 405 || finalRes.status === 403 || finalRes.status === 416) {
                    const c3 = new AbortController();
                    const t3 = setTimeout(() => c3.abort(), 15000);
                    const r3 = await fetch(url, {
                      method: 'GET',
                      redirect: 'follow',
                      signal: c3.signal,
                      headers: {
                        'User-Agent': ua,
                        'Accept': requireImage ? 'image/*' : '*/*',
                      },
                    });
                    clearTimeout(t3);
                    if (r3.status >= 200 && r3.status < 400) {
                      if (requireImage) {
                        const ct = (r3.headers.get('content-type') || '').toLowerCase();
                        if (!ct.startsWith('image/')) {
                          errors.push(`Content-Type 不是 image/* (实际: ${ct || '空'})`);
                          await sleep(500 * Math.pow(3, attempt));
                          continue;
                        }
                      }
                      return {
                        ok: true,
                        status: r3.status,
                        finalUrl: r3.url,
                        contentType: r3.headers.get('content-type'),
                        redirects,
                        attempts: attempt + 1,
                        fallback: true,
                      };
                    }
                    errors.push(`HTTP ${r3.status}`);
                  } else {
                    errors.push(`HTTP ${finalRes.status}`);
                  }
                } catch (e) {
                  clearTimeout(timer);
                  errors.push(e.name === 'AbortError' ? '超时(15s)' : e.message);
                }
                if (attempt < 2) await sleep(500 * Math.pow(3, attempt));
              }

              return { ok: false, errors, redirects, attempts: 3 };
            }

            function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

            function formatCheckResult(r, label, url) {
              if (r.ok) {
                const parts = [`✓ ${label} 可达 (HTTP ${r.status})`];
                if (r.attempts > 1) parts.push(`  · 重试 ${r.attempts} 次后成功`);
                if (r.fallback) parts.push(`  · 使用 fallback GET`);
                if (r.redirects && r.redirects.length) {
                  parts.push(`  · 重定向链：${url} → ${r.redirects.join(' → ')}`);
                }
                if (r.contentType) parts.push(`  · Content-Type: ${r.contentType}`);
                return parts.join('\n');
              }
              const parts = [`✗ ${label} 不可达 (${url})`];
              parts.push(`  · 尝试 ${r.attempts} 次，错误：${r.errors.join('；')}`);
              if (r.redirects && r.redirects.length) {
                parts.push(`  · 重定向链：${r.redirects.join(' → ')}`);
              }
              return parts.join('\n');
            }

            // ──────────────────────────────────────────────────
            // 主流程开始
            // ──────────────────────────────────────────────────
            await postWelcome();

            await upsertProgress([
              '## ⏳ 校验进行中',
              '',
              '正在读取 PR 文件清单...',
            ].join('\n'));

            // ── 1. PR 文件变更范围校验 ─────────────────────────
            let files = [];
            try {
              for await (const res of github.paginate.iterator(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number, per_page: 100 }
              )) {
                files.push(...res.data);
              }
            } catch (e) {
              await postResult(false, '无法读取 PR 文件清单', [`错误：${e.message}`]);
              await closePR();
              return;
            }

            if (files.length !== 1) {
              await postResult(false, 'PR 只能包含一个文件变更', [
                `当前变更数：${files.length}`,
                '',
                '请保证每个 PR 仅新增/修改/删除 `data/friends/` 下单个 `.json` 文件。',
                '',
                '**修复方法**：',
                '1. 关闭本 PR',
                '2. 在你的 fork 中创建多个独立 PR，每个 PR 只改一个文件',
              ]);
              await closePR();
              return;
            }

            const file = files[0];
            const FRIENDS_PREFIX = 'data/friends/';
            if (!file.filename.startsWith(FRIENDS_PREFIX)) {
              await postResult(false, '文件路径不合法', [
                `检测到文件：\`${file.filename}\``,
                `只允许更改 \`${FRIENDS_PREFIX}\` 下的文件。`,
              ]);
              await closePR();
              return;
            }

            if (!['added', 'modified', 'removed'].includes(file.status)) {
              await postResult(false, '不支持的文件操作', [`status: ${file.status}`]);
              await closePR();
              return;
            }

            // ── 2. 删除操作：跳过内容校验，直接合并 ───────────
            if (file.status === 'removed') {
              await upsertProgress([
                '## ⏳ 校验进行中',
                '',
                '✓ 文件路径合法（删除操作）',
                '',
                '正在执行合并...',
              ].join('\n'));
            } else {
              // ── 3. JSON 解析与 schema 校验 ─────────────────
              if (!file.filename.endsWith('.json')) {
                await postResult(false, '文件类型不合法', [
                  `检测到非 .json 文件：\`${file.filename}\``,
                  '`data/friends/` 下只允许 `.json` 文件。',
                ]);
                await closePR();
                return;
              }

              await upsertProgress([
                '## ⏳ 校验进行中',
                '',
                `✓ 文件路径合法：\`${file.filename}\``,
                '',
                '正在读取文件内容...',
              ].join('\n'));

              // 通过 PR files API 已返回的 patch 字段拿文件内容
              // 比 getContent 更稳定（getContent 在 pull_request_target 事件下
              // 对 fork PR 的 head ref 可能 404）
              let rawContent = '';
              if (file.patch) {
                // 解析 unified diff patch：去掉 @@ 行首，去掉 +/-/前缀空格
                rawContent = file.patch
                  .split('\n')
                  .filter((line) => !line.startsWith('@@') && !line.startsWith('---') && !line.startsWith('+++'))
                  .map((line) => (line.startsWith('+') ? line.slice(1) : line.startsWith(' ') ? line.slice(1) : line))
                  .join('\n')
                  .trim();
              } else if (file.status === 'added' || file.status === 'modified') {
                // patch 字段为空（大文件或 API 异常），回退到 raw_url 拉取
                try {
                  const res = await fetch(file.raw_url, {
                    headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` },
                  });
                  if (!res.ok) throw new Error(`HTTP ${res.status}`);
                  rawContent = await res.text();
                } catch (e) {
                  await postResult(false, '无法读取文件内容', [
                    `错误：${e.message}`,
                    `raw_url: ${file.raw_url}`,
                  ]);
                  await closePR();
                  return;
                }
              }

              await upsertProgress([
                '## ⏳ 校验进行中',
                '',
                `✓ 文件路径合法：\`${file.filename}\``,
                '✓ 文件内容已读取',
                '',
                '正在校验 JSON schema...',
              ].join('\n'));

              let data;
              try {
                data = JSON.parse(rawContent);
              } catch (e) {
                await postResult(false, 'JSON 解析失败', [
                  `文件：\`${file.filename}\``,
                  `错误：${e.message}`,
                  '',
                  '**修复方法**：用 [JSONLint](https://jsonlint.com/) 校验你的 JSON 语法。',
                ]);
                await closePR();
                return;
              }

              if (!data || typeof data !== 'object' || Array.isArray(data)) {
                await postResult(false, 'JSON 类型错误', [
                  'JSON 必须是对象 `{ ... }`，不能是数组或基本类型。',
                  '',
                  '**正确示例**：',
                  '```json',
                  '{',
                  '  "name": "你的站点名",',
                  '  "url": "https://example.com/",',
                  '  "avatar": "https://example.com/avatar.png",',
                  '  "description": "一句话简介"',
                  '}',
                  '```',
                ]);
                await closePR();
                return;
              }

              const errs = [];
              const isNonEmptyString = (v) => typeof v === 'string' && v.trim().length > 0;
              const isNullOrString = (v) => v === null || typeof v === 'string';
              const isHttpUrl = (v) => {
                if (typeof v !== 'string') return false;
                try {
                  const u = new URL(v);
                  return u.protocol === 'http:' || u.protocol === 'https:';
                } catch { return false; }
              };

              if (!isNonEmptyString(data.name)) errs.push('`name` 必填且为非空字符串');
              if (!isNonEmptyString(data.url)) errs.push('`url` 必填且为非空字符串');
              else if (!isHttpUrl(data.url)) errs.push('`url` 必须是 `http://` 或 `https://` URL');
              if (data.avatar !== undefined && !isNullOrString(data.avatar))
                errs.push('`avatar` 必须是字符串或 `null`（或省略）');
              if (data.description !== undefined && typeof data.description !== 'string')
                errs.push('`description` 必须是字符串（或省略）');

              // ── 4. vip 反作弊：PR 一律拒绝 ───────────────
              if (Object.prototype.hasOwnProperty.call(data, 'vip')) {
                await postResult(false, '检测到 vip 字段，已终止', [
                  '`vip` 字段仅站主直推 main 时可用，PR 不可携带。',
                  `文件：\`${file.filename}\``,
                  '',
                  '**修复方法**：删除 `vip` 字段后重新 push。',
                  '',
                  '```json',
                  '{',
                  '  "name": "...",',
                  '  "url": "...",',
                  '  "avatar": "...",',
                  '  "description": "..."',
                  '}',
                  '```',
                ]);
                await closePR();
                return;
              }

              if (errs.length) {
                await postResult(false, '数据校验未通过', [`文件：\`${file.filename}\``, '', ...errs]);
                await closePR();
                return;
              }

              // ── 5. URL 可达性检查（并行）─────────────────────
              await upsertProgress([
                '## ⏳ 校验进行中',
                '',
                `✓ 文件路径合法：\`${file.filename}\``,
                '✓ 文件内容已读取',
                '✓ JSON schema 校验通过',
                '✓ vip 字段检查通过',
                '',
                '🌐 正在并行检查站点 URL 和头像 URL 可达性...',
                '（多 UA 轮换 + 3 次重试，最多约 30 秒）',
              ].join('\n'));

              const tasks = [];
              tasks.push(
                fetchWithRetry(data.url, { requireImage: false })
                  .then((r) => ({ label: '站点 url', url: data.url, result: r }))
              );
              if (typeof data.avatar === 'string' && data.avatar.trim()) {
                tasks.push(
                  fetchWithRetry(data.avatar, { requireImage: true })
                    .then((r) => ({ label: '头像 avatar', url: data.avatar, result: r }))
                );
              }

              const results = await Promise.all(tasks);
              const failedChecks = results.filter((r) => !r.result.ok);

              if (failedChecks.length) {
                const lines = [];
                for (const r of results) {
                  if (!r.result.ok) {
                    lines.push('```');
                    lines.push(formatCheckResult(r.result, r.label, r.url));
                    lines.push('```');
                    lines.push('');
                  }
                }
                lines.push('**常见原因**：');
                lines.push('- URL 拼写错误或域名过期');
                lines.push('- 服务器无响应 / 防火墙拦截 GitHub Actions IP 段');
                lines.push('- 头像 URL 返回的不是图片（如返回 HTML 错误页）');
                lines.push('- 图床防盗链（解决：换用支持外链的图床，如 [sm.ms](https://sm.ms)、[imgur](https://imgur.com)）');
                lines.push('');
                lines.push('**修复方法**：');
                lines.push('1. 浏览器打开 URL 验证能否访问');
                lines.push('2. 修改后 push 到本 PR 触发重新校验');
                await postResult(false, 'URL 可达性检查未通过', lines);
                await closePR();
                return;
              }

              // 全部通过，写详情
              const detailLines = ['所有检查通过：'];
              for (const r of results) {
                detailLines.push('```');
                detailLines.push(formatCheckResult(r.result, r.label, r.url));
                detailLines.push('```');
                detailLines.push('');
              }
              await upsertProgress([
                '## ⏳ 校验进行中',
                '',
                `✓ 文件路径合法：\`${file.filename}\``,
                '✓ 文件内容已读取',
                '✓ JSON schema 校验通过',
                '✓ vip 字段检查通过',
                '✓ URL 可达性检查通过',
                '',
                ...detailLines,
                '正在执行自动合并...',
              ].join('\n'));
            }

            // ── 6. 自动合并 ────────────────────────────────────
            core.info('✅ 所有校验通过，执行自动合并');

            try {
              const mergeRes = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: 'squash',
                commit_title: `friends: ${file.status} ${file.filename} (#${pull_number})`,
                commit_message: `由 auto-pr workflow 自动合并\n\nCo-authored-by: ${prAuthor}`,
              });

              const successLines = [
                `已 squash merge 到 main：[\`${mergeRes.data.sha.substring(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${mergeRes.data.sha})`,
                '',
                '📦 接下来：',
                `- 正在触发 build workflow 重建 \`friends.json\`（约 30 秒）`,
                `- jsDelivr CDN 缓存约 12 小时，如需立即生效可访问 [purge.jsdelivr.net](https://purge.jsdelivr.net/gh/moaradc/moara-friends@main/friends.json) 强制刷新`,
                `- 数据 URL：\`https://cdn.jsdelivr.net/gh/moaradc/moara-friends@main/friends.json\``,
              ];
              await postResult(true, '校验通过，已自动合并', successLines);

              // 触发 build workflow（GITHUB_TOKEN 触发的 push 不会自动触发其他 workflow，
              // 需要 workflow_dispatch 手动启动）
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'build.yml',
                  ref: 'main',
                });
                core.info('✅ build workflow 已触发');
              } catch (e) {
                core.warning(`trigger build workflow failed: ${e.message}`);
              }
            } catch (e) {
              await postResult(false, '自动合并失败', [
                `错误：${e.message}`,
                '',
                '请手动合并此 PR 或联系仓库管理员。',
              ]);
              await closePR();
            }
