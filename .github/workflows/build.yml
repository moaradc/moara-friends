name: build

on:
  push:
    branches: [main]
    paths:
      - 'data/friends/**'
      - 'scripts/build.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-friends
  cancel-in-progress: false

jobs:
  build:
    # 只在上游仓库运行，fork 仓库不运行
    # 原因：build.yml 会自动 commit friends.json 回 main 分支
    # 如果 fork 也运行，fork main 会带上 friends.json，导致用户提 PR 到上游时
    # PR diff 包含 friends.json，被 PR 校验「只能包含一个文件变更」拒绝
    if: github.repository == 'moaradc/moara-friends'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build friends.json
        run: node scripts/build.js

      - name: Commit friends.json if changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- friends.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "moaradc"
          git config user.email "143486936+moaradc@users.noreply.github.com"
          git add friends.json
          git commit -m "chore: rebuild friends.json [skip ci]"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sL "https://purge.jsdelivr.net/gh/moaradc/moara-friends@main/friends.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print('purge:', d.get('status','?'))"
