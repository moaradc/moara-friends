name: issue-bot

# 友链申请 Issue 自动审核 + 写入仓库
#
# 设计：
# - 监听 issues.opened（标题以 [Friend Link] / [Edit] / [Delete] 开头）：
#   · [Friend Link] → 新增友链
#   · [Edit] → 修改友链（需域名验证）
#   · [Delete] → 删除友链（需域名验证）
# - 监听 issue_comment.created：
#   · /recheck → 重新校验
#   · /edit + 模板 → 修改友链（需域名验证）
#   · /delete + 模板 → 删除友链（需域名验证）
# - workflow_dispatch.review：批量重试所有开放友链 Issue
#
# 安全机制：
# - 修改/删除需要域名所有权验证（DNS TXT 或 .moara-friends-verify.txt）
# - 验证码格式：moara-friends=<Issue编号>（同 PR 路径）
# - 评论触发 /edit /delete 必须同时包含命令 + 完整模板
# - 只包含命令或只包含模板时只留评论提示，不触发

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（review = 扫描所有开放 Issue）'
        required: false
        default: 'review'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # 每个 Issue 独立 group，避免同时多个 Issue 互相取消
  group: issue-bot-${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  process:
    # 只在上游仓库运行
    # 标题前缀支持：[Friend Link] / [Edit] / [Delete]
    # 评论命令支持：/recheck /edit /delete
    if: |
      github.repository == 'moaradc/moara-friends' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && (
          startsWith(github.event.issue.title, '[Friend Link]') ||
          startsWith(github.event.issue.title, '[Edit]') ||
          startsWith(github.event.issue.title, '[Delete]')
        )) ||
        (github.event_name == 'issue_comment' && (
          startsWith(github.event.issue.title, '[Friend Link]') ||
          startsWith(github.event.issue.title, '[Edit]') ||
          startsWith(github.event.issue.title, '[Delete]')
        ) && (
          startsWith(github.event.comment.body, '/recheck') ||
          startsWith(github.event.comment.body, '/edit') ||
          startsWith(github.event.comment.body, '/delete')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Process issue (opened)
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_ACTION: ${{ github.event.action }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            const mode = process.env.ISSUE_ACTION || 'opened';
            await runIssueBot({
              mode,
              github,
              core,
              context,
              env: process.env,
            });

      - name: Process comment command (/recheck /edit /delete)
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            // 根据评论内容决定 mode
            const body = (process.env.COMMENT_BODY || '').trim().toLowerCase();
            let mode = 'recheck';  // 默认 /recheck
            if (body.startsWith('/edit')) {
              mode = 'comment_edit';
            } else if (body.startsWith('/delete')) {
              mode = 'comment_delete';
            }
            await runIssueBot({
              mode,
              github,
              core,
              context,
              env: process.env,
            });

      - name: Review all open friend-link issues (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            await runIssueBot({
              mode: 'review',
              github,
              core,
              context,
              env: process.env,
            });
