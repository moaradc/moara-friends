name: issue-bot

# 友链 Issue 自动审核 + 写入仓库（新增 / 修改 / 删除）
#
# 触发：
# - issues.opened：标题以 [Friend Link] / [Edit] / [Delete] 开头，按前缀自动路由
# - issue_comment.created：上述三种前缀的 Issue 上评论 /recheck、/edit、/delete
#   （!issue.pull_request 排除 PR 评论——PR 走 auto-pr.yml，不能被 Issue 流程误处理）
# - workflow_dispatch.review：批量重试所有开放的友链 Issue
#
# 校验通过后直接 git push data/friends/<filename>.json 并触发 build.yml。
# 校验规则与幂等逻辑见 scripts/validate-issue.mjs。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（review = 扫描所有开放 Issue）'
        required: false
        default: 'review'

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # 每个 Issue 独立 group，避免同时多个 Issue 互相取消。
  # issue_comment 事件用 issue 编号加入 group
  # workflow_dispatch 共用同一 group：批量重试时也至多一个 run
  group: issue-bot-${{ (github.event_name == 'issues' || github.event_name == 'issue_comment') && github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  process:
    # 只在上游仓库运行，fork 仓库不运行
    # 原因：issue-bot 会 git push data/friends/*.json 到 main 分支
    # fork 仓库即使触发也没意义（Issue 申请的是 fork 自己的友链，不是上游的）
    if: |
      github.repository == 'moaradc/moara-friends' && (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' && (
            startsWith(github.event.issue.title, '[Friend Link]') ||
            startsWith(github.event.issue.title, '[Edit]') ||
            startsWith(github.event.issue.title, '[Delete]')
          )
        ) ||
        (
          github.event_name == 'issue_comment' && (
            startsWith(github.event.issue.title, '[Friend Link]') ||
            startsWith(github.event.issue.title, '[Edit]') ||
            startsWith(github.event.issue.title, '[Delete]')
          ) && !github.event.issue.pull_request && (
            startsWith(github.event.comment.body, '/recheck') ||
            startsWith(github.event.comment.body, '/edit') ||
            startsWith(github.event.comment.body, '/delete')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：commitAndPushFriendFile 的 push 需要本地 HEAD 与远端一致
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Process friend-link issue (opened)
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_ACTION: ${{ github.event.action }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            // mode = issue action（opened）
            const mode = process.env.ISSUE_ACTION || 'opened';
            await runIssueBot({
              mode,
              github,
              core,
              context,
              env: process.env,
            });

      - name: Process issue comment command (/recheck, /edit, /delete)
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            await runIssueBot({
              mode: 'command',
              github,
              core,
              context,
              env: process.env,
            });

      - name: Review all open friend-link issues (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          FRIEND_LINK_TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { runIssueBot } = await import('${{ github.workspace }}/scripts/validate-issue.mjs');
            await runIssueBot({
              mode: 'review',
              github,
              core,
              context,
              env: process.env,
            });
